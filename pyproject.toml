[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plansense-ai-prototype"
version = "0.1.0"
description = "Evidence-traceable planning feasibility research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - evaluation only"}

[project.scripts]
plansense = "plansense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
